# 台帳に載せる前の候補。調べたが、まだ検証していない情報源をここに置く。
#
# 台帳（registry/sources/）は検証済みのものだけを載せる。検証していないものを
# 混ぜると台帳の価値が消えるが、調べた記録を捨てると次に同じ調査が繰り返される。
# ここはその中間状態の置き場であり、検証できたら registry/sources/ へ昇格させる。
#
# blocker は「なぜまだ検証していないか」であって、その情報源の性質ではない。
#   unreachable  自環境から到達できない。一次資料にも当たれないので何も書けない
#   credentials  到達はできるが、認証情報が手元に無いので実行できない
#   not_started  到達でき、認証も要らないか未確認。単にまだ着手していない
#
# hosts に挙げたホストは verify/verify_reachability.py が毎回実測する。
# 許可リストが変わればここの記録と実測がずれ、build.py が知らせる。
#
# 候補には、その情報源が何を提供するかを書かないこと。一次資料に当たる前に
# 書けるのは「名前」「ホスト」「なぜ調べたか」だけで、それ以外は推測になる。
# ただし一次資料に当たったあとの blocker_detail には、そこで実測した事実
# （認証を要求されたか、何が返ったか）を根拠つきで書く。それは推測ではない。
#
# retired: は、調べた結果として台帳の対象にならないと分かったもの。候補ではない
# ので候補件数に数えない。消すと次のセッションが同じ調査を繰り返すので残す。
candidates:
  - id: estat-api
    name: e-Stat API（政府統計の総合窓口）
    why: 政府統計を扱うなら最初に当たる情報源のため。
    hosts:
      - api.e-stat.go.jp
      - www.e-stat.go.jp
    blocker: credentials
    blocker_detail: >-
      利用には appId が必要で、まだ取得していない。ホストには到達できるので
      一次資料（API 仕様）は読めるが、実際に叩いて確かめることができない。
      検証できないものは台帳に載せないという原則により、ここで保留する。
      なお統計 LOD（estat-lod）は同じ e-Stat でも appId を要求しない別経路で、
      そちらは認証情報を待たずに検証できる。
    next_step: appId を取得したうえで、公開されている各エンドポイントを検証する。

  - id: jstage
    name: J-STAGE
    why: 学術論文の書誌・全文を扱う公的な情報源として。
    hosts:
      - www.jstage.jst.go.jp
      - api.jstage.jst.go.jp
    blocker: unreachable
    blocker_detail: >-
      一次資料は読めたが、API ホストに到達できない。公式マニュアル
      https://www.jstage.jst.go.jp/static/files/ja/manual_api.pdf （Ver.2.0、
      2026-03-26）がリクエスト先を https://api.jstage.jst.go.jp/searchapi/do
      と明示しており、そのホストへの GET はプロキシが 403（httpx の ProxyError）
      を返す。閲覧側の www.jstage.jst.go.jp には到達できるため、
      これは先方の障害ではなく自環境の egress。
      認証情報は不要と一次資料で確認した。利用規約第 2 条は
      「非営利目的で利用するときは、JST への利用申請は不要」とし、
      営利目的のときだけ申請書の提出を求めている。マニュアルにも API キーに
      あたるパラメータは無い。
    next_step: >-
      api.jstage.jst.go.jp を egress の許可リストに追加してもらう。通ったら
      巻号一覧・記事検索・資料検索の 3 機能を検証する。

  - id: houjin-bangou
    name: 法人番号システム Web-API（国税庁）
    why: 法人の名寄せに使える公的な識別子として。
    hosts:
      - api.houjin-bangou.nta.go.jp
      - www.houjin-bangou.nta.go.jp
    blocker: unreachable
    blocker_detail: >-
      認証要否を確定できなかった。仕様が置かれている
      www.houjin-bangou.nta.go.jp への GET はプロキシが 403（ProxyError）を
      返し、一次資料に到達できない。API ホスト api.houjin-bangou.nta.go.jp
      自体には到達できるが、パスの当てずっぽう（/4/num、/4/name、/4/diff を
      id 有り・無しで）はすべて Apache の 404 Not Found を返しただけで、
      これは「認証が要る」根拠にも「エンドポイントが無い」根拠にもならない。
      一次資料を読まずに認証要否を書くことはしない。
    next_step: >-
      www.houjin-bangou.nta.go.jp を egress の許可リストに追加してもらい、
      仕様書を読んでからエンドポイントと認証要否を確定する。

  - id: reinfolib
    name: 不動産情報ライブラリ（国土交通省）
    why: 不動産取引価格などを扱う情報源として。
    hosts: [www.reinfolib.mlit.go.jp]
    blocker: credentials
    blocker_detail: >-
      API キーが必要と実測で確認した。キー無しで
      https://www.reinfolib.mlit.go.jp/ex-api/external/XIT001 を叩くと
      HTTP 401 と {"statusCode":401,"message":"Access denied due to missing
      subscription key. ..."} が返る。一次資料
      https://www.reinfolib.mlit.go.jp/help/apiManual/ も、API 利用規約に
      同意して利用申請したうえで、発行された API キーを
      Ocp-Apim-Subscription-Key リクエストヘッダーに設定するよう求めている。
      申請はユーザー作業。
    next_step: >-
      API キーを取得する。取得できたら credential_env に環境変数名だけを書き、
      各エンドポイントを検証する。

  - id: nlftp-mlit
    name: 国土数値情報（国土交通省）
    why: 地理空間の統計データを扱う情報源として。
    hosts: [nlftp.mlit.go.jp]
    blocker: not_started
    blocker_detail: >-
      認証は不要と実測で確認した。データセットページ
      https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-N03-2026.html が
      示す実ファイル
      https://nlftp.mlit.go.jp/ksj/gml/data/N03/N03-2026/N03-20260101_GML.zip
      に Range ヘッダ付きで GET したところ、認証情報なしで HTTP 206・
      application/zip・Content-Range の総サイズ 803201348 が返った。
      なお API については、トップ（/ksj/）と /ksj/first.html、データセット
      ページのいずれにも案内が見当たらず、ダウンロード導線はすべて zip への
      直リンクだった。API があるともないとも一次資料が言っていないので
      undocumented 扱いとし、検証対象はファイル配布経路とする。
    next_step: >-
      検証対象のデータセットを絞り（まず N03 行政区域）、ダウンロード URL の
      規則性と利用約款を一次資料で確認してエントリを起こす。巨大な zip を
      毎回落とさずに済むよう、検証は Range で先頭だけを取る。

  - id: kanpo
    name: 官報
    why: 法令の公布や公示を一次で追える情報源として。
    hosts: [www.kanpo.go.jp]
    blocker: not_started
    blocker_detail: >-
      認証は不要と実測で確認した。日付別の全体目次
      https://www.kanpo.go.jp/20260821/20260821.fullcontents.html が
      認証情報なしで HTTP 200・HTML を返し、本文の目次が読めた。
      機械可読な提供経路（API・XML・JSON）は、トップと目次ページのリンクを
      見たかぎり見当たらず、日付とページで組み立てる HTML と PDF のみだった。
      候補に挙げていた notice.go.jp は官報とは無関係のサイト（IoT 機器の
      セキュリティ啓発サイト NOTICE）だったので hosts から外した。
    next_step: >-
      /ご利用に当たって（guidance.html）で転載・再利用の条件を確認する。
      機械可読な経路が本当に無いなら、HTML の目次構造をどこまで安定した
      インタフェースとみなせるかを判断してから、エントリにするか決める。

  - id: jpo-ip-data
    name: 特許庁 IP Data
    why: 産業財産権の情報を扱う情報源として。
    hosts: [ip-data.jpo.go.jp]
    blocker: credentials
    blocker_detail: >-
      ID・パスワードが必要と実測で確認した。トークン無しで
      https://ip-data.jpo.go.jp/api/patent/v1/app_progress/2020000001 を叩くと
      HTTP 401 と {"result":{"statusCode":"210","errorMessage":"無効な
      トークンです。",...}} が返る。一次資料
      https://ip-data.jpo.go.jp/files/アクセス方法.pdf は、利用登録時に通知
      される URL へ grant_type=password と特許庁発行の ID・パスワードを
      POST してアクセストークン（有効期間 1 時間）を取得し、
      Authorization: Bearer で各 API を呼ぶ手順を示している。
      利用登録はユーザー作業。
      なお OpenAPI 仕様 https://ip-data.jpo.go.jp/api_guide/api_reference.js
      （42 パス）には securitySchemes の記述が無く、認証の記述は仕様ではなく
      別 PDF にある。仕様に securitySchemes が無いことは認証不要の根拠に
      ならない例。
    next_step: >-
      利用登録して ID・パスワードを取得する。取得できたらトークン取得から
      各 API までを検証する。アクセス数に日次上限がある点も記録する。

  - id: iryou-teikyou
    name: 医療機関等情報提供制度（厚生労働省）
    why: 医療機関の所在や機能を扱う情報源として。
    hosts: [www.iryou.teikyouseido.mhlw.go.jp]
    blocker: not_started
    blocker_detail: >-
      認証は不要と実測で確認した。トップ
      https://www.iryou.teikyouseido.mhlw.go.jp/znk-web/juminkanja/S2300/initialize
      が認証情報なしで HTTP 200・HTML を返した。
      ただし機械可読な提供経路は見当たらない。トップのリンクはすべて画面遷移
      （/znk-web/juminkanja/S____/initialize）で、CSV・オープンデータ・
      一括ダウンロードへの導線は無かった。
    next_step: >-
      検索画面の遷移がクエリで表現できるか、あるいは都道府県ごとの
      オープンデータが別のホストで公開されていないかを一次資料で確認する。
      機械可読な経路が無いなら候補から外す判断も含めて決める。

  - id: mlit-data
    name: 国土交通データプラットフォーム（国土交通 DPF 利用者 API）
    why: >-
      RESAS API の提供終了案内が、代替として利用できるサイトの筆頭に
      挙げていたため。
    hosts: [www.mlit-data.jp]
    blocker: unreachable
    blocker_detail: >-
      https://www.mlit-data.jp/api_docs/ への GET はプロキシが 403
      （ProxyError）を返し、一次資料に到達できない。先方の障害ではなく
      自環境の egress。到達できない以上、何を提供するかも認証要否も書かない。
    next_step: >-
      www.mlit-data.jp を egress の許可リストに追加してもらい、
      API 仕様を読んで認証要否を確定する。

# 調べた結果、台帳の対象にならないと分かったもの。候補ではないので
# 「いま着手できるもの」には数えない。消すと同じ調査が繰り返される。
retired:
  - id: resas
    name: RESAS API（地域経済分析システム）
    why: 地域経済の統計を扱う情報源として調べた。
    hosts: [opendata.resas-portal.go.jp]
    reason: >-
      提供が終了している。一次資料
      https://opendata.resas-portal.go.jp/docs/api/v1/index.html が
      「RESAS API は、2025年3月24日（月）をもって、提供を終了することと
      なりました」「2024年10月31日（木）をもちまして、RESAS API ページにて
      新たにアカウントを作成する機能を終了いたします」「2025年3月24日以降は
      自動的にアカウントが削除され、API 機能のご利用を停止いたします」と
      明記している。実測でも
      https://opendata.resas-portal.go.jp/api/v1/prefectures が HTTP 404 と
      HTML を返し、API として応答しない。到達できないから終了と解釈したのでは
      なく、提供元が終了を明記している。
    alternatives: >-
      同じ案内が代替として挙げているのは、国土交通データプラットフォーム
      利用者 API（候補 mlit-data）、不動産情報ライブラリ（候補 reinfolib）、
      e-Stat API（候補 estat-api）。

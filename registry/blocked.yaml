# 調査したが、検証環境の egress ポリシーで到達できず台帳に登録できなかった候補。
#
# 台帳（registry/sources/）は検証済みの情報源だけを載せる。到達できない情報源は
# 事実を書く根拠が無いのでエントリにできないが、調査した記録を捨てると次に同じ
# 調査が繰り返される。ここはその待避所であり、egress が開いたら検証して昇格させる。
#
# hosts に挙げたホストは verify/verify_reachability.py が毎回実測するので、
# 許可リストが変わればここの記録と実測がずれ、気づける。
candidates:
  - id: api-candidates-sweep
    name: 公的機関の API 候補（一括調査）
    why: >-
      台帳の幅を広げるため、政府・公的機関が提供する API を横断的に探した。
      カタログには API 形式のリソースが 1 件も無く、デジタル庁の開発者サイトにも
      公開 API は Jグランツしか載っていないため、省庁ごとに個別に当たる必要がある。
    hosts:
      - ndlsearch.ndl.go.jp
      - www.jstage.jst.go.jp
      - cyberjapandata.gsi.go.jp
      - data.e-stat.go.jp
      - api.houjin-bangou.nta.go.jp
      - opendata.resas-portal.go.jp
      - www.reinfolib.mlit.go.jp
      - nlftp.mlit.go.jp
      - www.kanpo.go.jp
      - ip-data.jpo.go.jp
      - www.iryou.teikyouseido.mhlw.go.jp
    blocked_reason: >-
      候補として挙げた 16 ホストのうち 15 がプロキシに 403 で拒否された
      （到達できたのは既に許可済みの api.e-stat.go.jp のみ）。一次資料に到達できないため、
      提供内容・認証要否・利用規約のいずれも確認できない。egress は許可リスト方式であり、
      許可されていないホストは一律に塞がれる。二次情報だけを根拠に候補の性質を
      書くことは台帳の規律に反するので、ここには「調べようとして到達できなかった」
      という事実だけを残す。
    next_step: >-
      これらのホストを egress 許可リストに追加したうえで、各サービスの一次資料
      （OpenAPI 仕様や API ドキュメント）に到達し、認証要否を確認してから検証に進む。

  - id: catalog-resource-hosts
    name: e-Gov データポータルの実ファイル置き場
    why: >-
      カタログに載る機械可読データセット 1,121 件のうち、実際にファイルを取得できるのが
      どれだけあるかを確かめた。カタログ自体は到達できても、実ファイルは省庁ごとの
      ホストに置かれているため、そちらが塞がれていれば取得できない。
    hosts:
      - housyasen.env.go.jp
      - www.bb.mof.go.jp
      - warp.ndl.go.jp
      - www.esri.cao.go.jp
      - www.jinji.go.jp
      - www.soumu.go.jp
      - www5.cao.go.jp
      - www.mofa.go.jp
      - ikilog.biodic.go.jp
      - www.rinya.maff.go.jp
      - www.hokoukukan.go.jp
      - www.mext.go.jp
      - www.npa.go.jp
      - www8.cao.go.jp
      - www.maff.go.jp
      - maps.gsi.go.jp
      - notice.go.jp
      - saigai.gsi.go.jp
      - www.kodokensaku.mlit.go.jp
    blocked_reason: >-
      実ファイルの置き場 23 ホストのうち 19 がプロキシに 403 で拒否され、
      機械可読データセット 1,121 件のうち到達できるのは 513 件（46%）にとどまる。
      到達できないのは提供が止まっているからではなく、この環境の egress ポリシーで
      許可されていないため。件数の多い順に housyasen.env.go.jp（299 件）、
      www.bb.mof.go.jp（150 件）、warp.ndl.go.jp（52 件）。
    next_step: >-
      件数の多いホストから egress 許可リストに追加する。追加後は
      verify/survey_catalog.py を回せば到達できるデータセット数が更新される。
